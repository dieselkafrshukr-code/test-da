<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر ديزل كفر شكر</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Header -->
    <header class="main-header glass-effect">
        <div class="container header-container">
            <div class="logo">
                <i class="fa-solid fa-store"></i>
                <h1>ديزل كفر شكر</h1>
            </div>

            <nav class="main-nav">
                <a href="#home" class="active">الرئيسية</a>
                <a href="#products">المنتجات</a>
                <a href="#contact">تواصل معنا</a>
            </nav>

            <div class="cart-icon">
                <i class="fa-solid fa-shopping-cart"></i>
                <span class="cart-badge">0</span>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero-section">
        <div class="hero-content">
            <h1>أحدث الإلكترونيات بأفضل الأسعار</h1>
            <p>تسوق الآن واحصل على عروض حصرية على الهواتف، اللابتوبات، والإكسسوارات.</p>
            <a href="#products" class="btn-primary pulse-effect">تصفح المنتجات <i
                    class="fa-solid fa-arrow-left"></i></a>
        </div>
        <div class="hero-shape"></div>
    </section>

    <!-- Products Section -->
    <section id="products" class="products-section">
        <div class="container">
            <h2 class="section-title">وصل حديثاً</h2>

            <!-- Dynamic Products Container -->
            <div id="products-grid" class="products-grid">
                <!-- Products will be loaded here from Firebase -->
                <div class="loading-placeholder">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <p>جاري تحميل المنتجات...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer id="contact">
        <div class="container">
            <p>جميع الحقوق محفوظة &copy; 2024 متجر ديزل كفر شكر</p>
            <div class="social-links">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>

</html>
